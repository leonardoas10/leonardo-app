name: CI

on:
    pull_request:
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node-modules-cache
              with:
                  path: node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-

            - name: Install dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Cache Next.js build cache
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.{ts,tsx,js,jsx}') }}
                  restore-keys: |
                      next-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
                      next-cache-${{ runner.os }}-

            - name: Prepare CI build inputs
              run: cp .github/fixtures/amplify_outputs.json amplify_outputs.json

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_CLOUDFRONT_URL_IMAGES: https://example.com/images
                  NEXT_PUBLIC_CLOUDFRONT_URL_HOSTNAME: example.com
                  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-stub
                  NEXT_PUBLIC_GTM_ID: GTM-XXXXXXX
